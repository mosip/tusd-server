#----------------------------------------------------------------------------------
#------------------------------------------ 3. existing MOSIP TUS Server --------------------------------------------------
  mosip-tusd:
    image: mosip-tusd:latest
    build: 
      context: ../../tusd-server
      dockerfile: Dockerfile
    container_name: mosip_tusd_server
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"
    volumes:
      - telemetry_shared_volume:/srv/tusd-data/data
  
  #--------------------------------------------------------------------------
  # ------------------- This service part of new architecture - Grafana Alloy + Loki + Prometheus + Grafana-----------------------------
  # Grafana Alloy (Telemetry Shipper & Collector)
  grafana-alloy:
    image: grafana/alloy:v1.2.0
    container_name: telemetry_alloy_collector
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:12345" # Alloy internal health/metrics UI
    volumes:
      - telemetry_shared_volume:/var/log/tusd:ro
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      mosip-tusd:
       condition: service_started
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
  # ---------------------------------------------------------------------------------------------------------------------------------

  # ------------------- This service part of new architecture - Grafana Alloy + Loki + Prometheus + Grafana-----------------------------
  # Grafana Loki (Log Ingestion Engine for Audit & Event Streams)
  loki:
    image: grafana/loki:3.0.0
    container_name: local_loki
    user: "0:0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------------------------------------------------------------

  # -------------------------- This service part of new architecture - Grafana Alloy + Loki + Prometheus + Grafana-----------------------------

  # Prometheus (Time-Series Database for Telemetry & App Metrics)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: local_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------------------------------------------------------------

  # ------------------------- This service part of new architecture - Grafana Alloy + Loki + Prometheus + Grafana-----------------------------

  # Grafana (Unified Visualization Dashboard for LogQL and PromQL)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: local_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki
      - prometheus

