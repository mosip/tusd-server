services:
  # 1. Zookeeper (Required for Kafka to manage cluster state)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: local_zookeeper
    restart: unless-stopped          # PROD: keep it up across host reboots / crashes
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 2. Local Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: local_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # 29092 = internal Docker network (Vector), 9092 = host machine (testing)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # PROD: don't rely on auto-creation in a real environment. Disable this
      # and create the topic explicitly (correct partitions/replication/retention)
      # via a one-off `kafka-topics --create` job before traffic starts.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 15

  # 3. Your existing MOSIP TUS Server
  mosip-tusd:
    image: mosip-tusd:latest
    build: .
    container_name: mosip_tusd_server
    restart: unless-stopped
    ports:
      - "8080:1080"
    volumes:
      # FIXED the typo here: was "telemetry_shared_volum" (missing "e"),
      # which doesn't match the volume declared below — this alone can
      # prevent `docker compose up` from starting, or silently bind to a
      # brand-new empty volume instead of the one you think you're using.
      - telemetry_shared_volume:/srv/tusd-data/data
    # IMPORTANT: confirm inside your Dockerfile/entrypoint that whatever
    # hook script handles pre-create/post-finish events writes a dedicated
    # JSON-lines log file into this same path (e.g. tusd-events.log) —
    # NOT just raw uploaded file bytes + *.info metadata. Vector can only
    # ship structured log lines, not arbitrary binary upload content.
    # healthcheck:
    #   PROD: add a real healthcheck once you confirm tusd exposes an
    #   endpoint you can curl/wget from inside the container, e.g.:
    #   test: ["CMD", "wget", "-q", "--spider", "http://localhost:1080/"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  # 4. Vector Log Shipper Sidecar
  vector-shipper:
    image: timberio/vector:0.34.1-alpine
    container_name: telemetry_vector_shipper
    restart: unless-stopped
    volumes:
      - telemetry_shared_volume:/var/log/tusd:ro
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      mosip-tusd:
        condition: service_started
      kafka:
        condition: service_healthy

# Declare the shared volume (name now matches both mounts above)
volumes:
  telemetry_shared_volume: