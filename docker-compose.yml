services:
  # 1. Zookeeper (Required for Kafka to manage cluster state)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: local_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 2. Local Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: local_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # 29092 is for internal Docker containers (Vector), 9092 is for your host machine (testing)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    # Tell Docker to ping Kafka until it is fully online and ready
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 15

  # 3. Your existing MOSIP TUS Server
  mosip-tusd:
    image: mosip-tusd:latest
    build: .
    container_name: mosip_tusd_server
    ports:
      - "8080:1080"
    volumes:
      - telemetry_shared_volume:/srv/tusd-data/data

  # 4. Vector Log Shipper Sidecar
  vector-shipper:
    image: timberio/vector:0.34.1-alpine
    container_name: telemetry_vector_shipper
    volumes:
      - telemetry_shared_volume:/var/log/tusd:ro
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      mosip-tusd:
        condition: service_started
      kafka:
        condition: service_healthy

# Declare the shared volume boundary
volumes:
  telemetry_shared_volume: